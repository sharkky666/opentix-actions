name: Show Crawler

on:
  #schedule:
  #  - cron: '*/30 * * * *'
  #  min(0-59) hour(0-23) day(1-31) month(1-12/JAN-DEC) week(0-7, 0&7 = sun)
  workflow_dispatch:

# 新增全域環境變數，強制讓所有 Actions 套件改用 Node 24 執行
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  run-crawler:
    name: 🎫 售票狀況定時監控
    runs-on: ubuntu-latest
    steps:
      - name: Step1-Checkout Repository
        uses: actions/checkout@v4

      - name: Step2-Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Step3-Call API
        run: |
          curl -s "https://csm.api.opentix.life/programs/2051591825313611777" \
          -o response.json

      - name: Step4-Extract Specific Content
        run: |
          # 下面的「過濾座位區」邏輯整塊提到前面，用括號包起來，並把它存成一個叫做 $filtered_sections 的臨時陣列變數
          jq '.result.eventVenues[] | select(.id == "2051593347817213953").events[] | 
          select(.id | IN("2052682612679090177","2052683047905329153","2052682637388972033","2052683057301188609","2052683065424936961","2052682652327120897","2052683073990541313","2055211724284375041","2055235348896714752")) |
          (
            [
              .groupSections.default[] | 
              select(.name | tostring | [contains("視線受限"), contains("友善"), contains("輪椅")] | any | not) | 
              {name: .name, quantity: .quantity.remainingQuantity}
            ]
          ) as $filtered_sections |
          {
            showTime: ((.startDateTime + 28800) | strftime("%Y-%m-%d %H:%M:%S")), 
            quantity: ($filtered_sections | map(.quantity) | add // 0), 
            sections: $filtered_sections
          }' response.json > new.json

      - name: Step5-Compare JSON
        id: compare
        run: |
          if [ -f data/latest.json ]; then
            # Step4 已改動計算模式(外層的 quantity 已為「一般座位」總和)
            # jq -c '{showTime, sections}' data/latest.json > old_only_sections.json
            # jq -c '{showTime, sections}' new.json > new_only_sections.json
            # if diff -q old_only_sections.json new_only_sections.json > /dev/null; then
            
            if diff -q data/latest.json new.json > /dev/null; then
              echo "same=true" >> $GITHUB_OUTPUT
            else
              echo "same=false" >> $GITHUB_OUTPUT
            fi
          else
            # 如果是第一次執行，完全沒有舊檔案，直接判定為不同
            echo "same=false" >> $GITHUB_OUTPUT
          fi

      - name: Step6-Capture Differences
        id: get_diff
        if: steps.compare.outputs.same == 'false'
        run: |
          echo "diff_content<<EOF">> $GITHUB_OUTPUT
          if [ -f data/latest.json ]; then
            # 使用 diff -u 比較新舊檔案的差異
            # 關鍵改動：加上 -U 12，擴大上下上下文範圍，確保秀出場次時間與完整區域
            diff -u -U 30 data/latest.json new.json || true
          else
            echo "這是第一次執行，以下為初始抓取的資料："
            cat new.json
          fi >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Step7-Update Stored JSON
        if: steps.compare.outputs.same == 'false'
        run: |
          mkdir -p data
          cp -f new.json data/latest.json

      - name: Step8-Commit Changes
        if: steps.compare.outputs.same == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/latest.json

          git commit -m "Update API data"

          git push

      - name: Step9-Send Mail Notification
        if: steps.compare.outputs.same == 'false'
        # 將 v3 升級為 v4，官方在新版已原生支援 Node 24
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: Optentix Data Changed
          to: sharkky865180@gmail.com, kaworuattie@gmail.com
          from: GitHub Actions-Optentix內容已變更

          body: |
            ${{ steps.compare.outputs.same == 'false' && '有新' || '無' }} 變更
            變更細節（- 代表減少/賣出，+ 代表增加/釋票）：
            ```diff
            ${{ steps.get_diff.outputs.diff_content }}
            ```
            
